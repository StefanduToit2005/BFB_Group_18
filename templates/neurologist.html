<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediLink | Neurologist requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../static/styles.css" rel="stylesheet">
</head>
<body>
  <div id="site-nav"></div>

  <main id="main">
    <header class="ml-page-header">
      <div class="container d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
          <h1>My requests</h1>
          <p>Forwarded by admin and sorted by urgency, then by how long they've waited.</p>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="showDone">
          <label class="form-check-label" for="showDone">Show completed today</label>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="row g-3 mb-4">
        <div class="col-4"><div class="kpi-tile text-center"><div class="kpi-label">Urgent</div><div class="kpi-value text-danger" id="cUrgent">&ndash;</div></div></div>
        <div class="col-4"><div class="kpi-tile text-center"><div class="kpi-label">Soon</div><div class="kpi-value" style="color:#8a5a00" id="cSoon">&ndash;</div></div></div>
        <div class="col-4"><div class="kpi-tile text-center"><div class="kpi-label">Routine</div><div class="kpi-value" id="cRoutine">&ndash;</div></div></div>
      </div>
      <div id="requestList" aria-live="polite"></div>
    </div>
  </main>

  <!-- Complete modal -->
  <div class="modal fade" id="doneModal" tabindex="-1" aria-labelledby="doneTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="doneForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="doneTitle">Complete request</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="small text-muted" id="doneFor"></p>
            <label for="doneResponse" class="form-label required">Reply or outcome</label>
            <textarea class="form-control" id="doneResponse" rows="4" required minlength="3" aria-describedby="doneHelp"></textarea>
            <div id="doneHelp" class="form-text">The patient sees this in their portal.</div>
            <div class="invalid-feedback">Please write a short reply or outcome.</div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1" aria-hidden="true"></i>Mark completed</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/auth-hash.js"></script>
  <script src="../static/data.js"></script>
  <script src="../static/components.js"></script>
  <script src="../static/neurologist.js"></script>
</body>
</html>
